name: CI

# Pull-request and push checks: install, build and run the test suite.
# Read-only: no secrets, no publish or deploy steps, and the checkout
# token is not persisted. Mirrors the install/build/test steps the
# publish workflow already runs, so a PR is checked before it merges.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # npm 10 (bundled with Node 22) crashes resolving this dev tree
      # ("Cannot read properties of null (reading 'edgesOut')"); npm 11
      # installs it. Node 22 still runs the build and tests.
      - name: Use npm 11 on Node 22
        if: matrix.node == 22
        run: npm install -g npm@11 --no-audit --no-fund
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  # SDK drift guard (#135): the job above only sees the pinned devDependency
  # (2026.8.1). This one overlays real newer OpenClaw releases with --no-save
  # (package.json and the lockfile are untouched) and runs ONLY the contract
  # suite, so a moved or removed semi-internal file fails CI instead of
  # surfacing in production. MULTI_CLAWD_EXPECT_OPENCLAW makes the suite fail
  # if the overlay silently did not take. `latest` has no expectation: it is the
  # early-warning lane for the next release.
  sdk-contract-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - openclaw: "2026.10.10"
            expect: "2026.10.10"
          - openclaw: "2026.11.1"
            expect: "2026.11.1"
          - openclaw: "latest"
            expect: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund openclaw@${{ matrix.openclaw }}
      - run: npm run build
      - run: npx vitest run tests/openclaw-sdk-contract.test.ts
        env:
          MULTI_CLAWD_EXPECT_OPENCLAW: ${{ matrix.expect }}

  # Route evidence for #155 (does NOT close it): drives a throwaway OpenClaw
  # gateway child through the documented `openclaw cron` CLI with the fake
  # Claude subprocess, and records whether the pool is refused at admission
  # (S0, the current upstream behaviour) and whether a job admitted through the
  # fixture-only modelProvider + agentRuntime path actually runs on a pool
  # account (S1-S3). Scratch HOME/state, empty account dirs, no credentials, no
  # secrets, and a tripwire that refuses every non-loopback network attempt.
  # MC155_GATEWAY_ROUTE=1 is what allows the gateway child to start; it is set
  # here and nowhere else. `latest` is the early-warning lane, as above.
  cron-route-evidence-155:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - openclaw: "2026.10.10"
            expect: "2026.10.10"
          - openclaw: "2026.11.1"
            expect: "2026.11.1"
          - openclaw: "2026.11.3"
            expect: "2026.11.3"
          - openclaw: "latest"
            expect: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund openclaw@${{ matrix.openclaw }}
      - run: npm run build
      - run: npx vitest run tests/issue-155-unbound-cron-route.test.ts
        env:
          MC155_GATEWAY_ROUTE: "1"
          MULTI_CLAWD_EXPECT_OPENCLAW: ${{ matrix.expect }}
          MC155_EVIDENCE_OUT: ${{ runner.temp }}/mc155-evidence.json
      # A skipped gateway block must never read as a pass: the evidence file
      # has to exist and carry every scenario. Printed so the run log is the
      # evidence record.
      - name: Evidence file is complete
        if: always()
        env:
          MC155_EVIDENCE_OUT: ${{ runner.temp }}/mc155-evidence.json
        run: |
          cat "$MC155_EVIDENCE_OUT"
          node -e '
            const e = JSON.parse(require("node:fs").readFileSync(process.env.MC155_EVIDENCE_OUT, "utf8"));
            const missing = ["S0", "S1", "S2", "S3", "M0_tripwire", "M1_tripwire"].filter((k) => !(k in e));
            if (missing.length) { console.error("mc155 evidence incomplete, missing: " + missing.join(", ")); process.exit(1); }
            console.log("mc155 evidence complete for openclaw " + e.openclaw);
          '
